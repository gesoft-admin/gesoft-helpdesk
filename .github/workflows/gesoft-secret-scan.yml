# Runs this fork's own secret scan on every push and pull request.
#
# Separate from the upstream workflows in this directory, and named so it is
# obvious which are ours: an upstream merge should never quietly take this away.
name: Gesoft secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan compares against the fork baseline, so it needs the history
          # that reaches it. A shallow checkout would find no merge base and
          # silently scan nothing.
          fetch-depth: 0

      - name: Scan this fork's own files
        run: ./scripts/secret-scan.sh --all
